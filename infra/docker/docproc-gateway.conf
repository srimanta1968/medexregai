# docproc-gateway (docker-compose.yml): relays TCP from the host's 127.0.0.1:4200 to the
# sandboxed docproc container, which sits on an internal network with no route out.
# Plain TCP relay: docproc authenticates every /v1 call itself (X-Docproc-Key).

worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

stream {
  server {
    listen 4200;
    proxy_pass docproc:4200;
    proxy_connect_timeout 5s;
    # Above docproc's 120 s parse limit, so its PARSE_TIMEOUT answer gets through.
    proxy_timeout 180s;
  }
}
