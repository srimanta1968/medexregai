# =============================================================================
# MedexRegAI - local development services
#
#   1. scripts/setup-env.sh        create server/.env, client/.env and .env (secrets)
#   2. docker compose up -d        start the services below; all have health checks
#   3. scripts/pull-models.sh      download the local AI models into Ollama
#   4. docker compose ps           every service should read "healthy"
#
# Credentials come from the gitignored root .env written by scripts/setup-env.sh.
# Compose refuses to start a service whose credential is missing, instead of
# falling back to a known default.
#
# Ports (host side):
#   postgres 5433  (5432 is usually taken by the shared ProjexLight Postgres, which
#                   server/.env points at by default; switch DB_PORT=5433 to use this one)
#   redis    6379   s3 (SeaweedFS S3 API) 9000   ollama 11434
#
# The document-ingest sidecar (Docling, task F7.2) joins this file when it is built.
# The ProjexLight Dev MCP is normally started by mcp-server/setup-all.sh; the
# bundled definition below only runs with:  docker compose --profile mcp up -d
# =============================================================================

name: medexregai

services:
  postgres:
    # PostgreSQL 17 with the pgvector extension (vector search, E7).
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup-env.sh to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-medexregai_db}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app_network]

  redis:
    # Job queues (BullMQ), rate limits and cache. Never caches client content.
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app_network]

  s3:
    # S3-compatible object storage for uploads, extracted text and exports
    # (SeaweedFS, Apache-2.0). Production uses AWS S3; the API only speaks the S3 API.
    # The identities file is written from .env at startup, so no credential is committed.
    image: chrislusf/seaweedfs:3.87
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run scripts/setup-env.sh to create .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run scripts/setup-env.sh to create .env}
    entrypoint:
      - /bin/sh
      - -c
      - >
        printf '{"identities":[{"name":"medexregai","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0
    ports:
      - "${S3_HOST_PORT:-9000}:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/healthz && nc -z localhost 8333"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped
    networks: [app_network]

  s3-init:
    # One-shot: create the API's bucket once storage is healthy, then exit.
    image: chrislusf/seaweedfs:3.87
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-medexregai-dev}
    entrypoint:
      - /bin/sh
      - -c
      - >
        echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=s3:9333 &&
        echo "bucket $$S3_BUCKET ready"
    restart: "no"
    networks: [app_network]

  ollama:
    # Our own self-hosted models (default AI provider). Models persist in the volume;
    # download them with scripts/pull-models.sh.
    image: ollama/ollama:0.6.8
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [app_network]

  # ProjexLight MCP Server - Code Review Agent & Schema Sync (opt-in profile).
  # Image pulled from Docker Hub: https://hub.docker.com/r/projexlight/projex-dev-mcp
  mcp-server:
    profiles: ["mcp"]
    image: projexlight/projex-dev-mcp:latest
    pull_policy: always
    container_name: medexregai_mcp_server
    user: root  # Required for git hooks installation on Windows
    ports:
      - "${MCP_SERVER_PORT:-8766}:8766"
    volumes:
      - ./:/workspace
      - ./.projexlight/feedback:/feedback
      - ./mcp-server/mcp-config.json:/app/mcp-config.json:ro
    env_file:
      - ./mcp-server/.env
    environment:
      - WORKSPACE_PATH=/workspace
      - FEEDBACK_PATH=/feedback
      - MCP_SERVER_PORT=8766
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_CONFIG_FILE=/app/mcp-config.json
      - SCHEMA_SYNC_ENABLED=${SCHEMA_SYNC_ENABLED:-true}
      - SCHEMA_SYNC_INTERVAL=${SCHEMA_SYNC_INTERVAL:-30}
      - AUTO_APPLY_MIGRATIONS=${AUTO_APPLY_MIGRATIONS:-false}
      - DEVELOPER_ID=${DEVELOPER_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [app_network]

volumes:
  postgres_data:
  redis_data:
  s3_data:
  ollama_data:

networks:
  app_network:
    driver: bridge
