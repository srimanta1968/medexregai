# =============================================================================
# MedexRegAI - local development services
#
#   1. scripts/setup-env.sh        create server/.env, client/.env and .env (secrets)
#   2. docker compose up -d        start the services below; all have health checks
#   3. scripts/pull-models.sh      download the local AI models into Ollama
#   4. docker compose ps           every service should read "healthy"
#
# Credentials come from the gitignored root .env written by scripts/setup-env.sh.
# Compose refuses to start a service whose credential is missing, instead of
# falling back to a known default.
#
# Ports (host side):
#   postgres 5433  (5432 is usually taken by the shared ProjexLight Postgres, which
#                   server/.env points at by default; switch DB_PORT=5433 to use this one)
#   redis    6379   s3 (SeaweedFS S3 API) 9000   ollama 11434
#   docproc  4200   (127.0.0.1 only, through docproc-gateway)
#
# docproc parses client files in a sandbox (F7.2, ADR-013): it sits alone on an
# internal network with no route out, so a hostile file cannot call anywhere.
# Check it with:  scripts/verify-docproc-sandbox.sh
# The ProjexLight Dev MCP is normally started by mcp-server/setup-all.sh; the
# bundled definition below only runs with:  docker compose --profile mcp up -d
# =============================================================================

name: medexregai

services:
  postgres:
    # PostgreSQL 17 with the pgvector extension (vector search, E7).
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup-env.sh to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-medexregai_db}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app_network]

  redis:
    # Job queues (BullMQ), rate limits and cache. Never caches client content.
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app_network]

  s3:
    # S3-compatible object storage for uploads, extracted text and exports
    # (SeaweedFS, Apache-2.0). Production uses AWS S3; the API only speaks the S3 API.
    # The identities file is written from .env at startup, so no credential is committed.
    image: chrislusf/seaweedfs:3.87
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run scripts/setup-env.sh to create .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run scripts/setup-env.sh to create .env}
    entrypoint:
      - /bin/sh
      - -c
      - >
        printf '{"identities":[{"name":"medexregai","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0
    ports:
      - "${S3_HOST_PORT:-9000}:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && nc -z 127.0.0.1 8333"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped
    networks: [app_network]

  s3-init:
    # One-shot: create the API's bucket once storage is healthy, then exit.
    image: chrislusf/seaweedfs:3.87
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-medexregai-dev}
    entrypoint:
      - /bin/sh
      - -c
      - >
        echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=s3:9333 &&
        echo "bucket $$S3_BUCKET ready"
    restart: "no"
    networks: [app_network]

  ollama:
    # Our own self-hosted models (default AI provider). Models persist in the volume;
    # download them with scripts/pull-models.sh.
    image: ollama/ollama:0.6.8
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [app_network]

  fda-postgres:
    # FDA corpus database (ADR-017): its own instance, never shared with customer data.
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${FDA_POSTGRES_USER:-fda}
      POSTGRES_PASSWORD: ${FDA_POSTGRES_PASSWORD:?run scripts/setup-env.sh to create .env}
      POSTGRES_DB: fda_db
    ports:
      - "${FDA_POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - fda_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d fda_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [fda_network]

  fda-api:
    # fda-data service API (/v1). Reachable by the main app over fda_network only.
    build: ./services/fda-data
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
    environment:
      PORT: 4100
      FDA_DATABASE_URL: postgres://${FDA_POSTGRES_USER:-fda}:${FDA_POSTGRES_PASSWORD}@fda-postgres:5432/fda_db
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
    ports:
      - "${FDA_API_HOST_PORT:-4100}:4100"
    depends_on:
      fda-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [fda_network, app_network]

  fda-worker:
    # Daily openFDA sync and bulk loads; writes only to fda-postgres.
    build: ./services/fda-data
    command: ["node", "dist/worker.js"]
    environment:
      FDA_DATABASE_URL: postgres://${FDA_POSTGRES_USER:-fda}:${FDA_POSTGRES_PASSWORD}@fda-postgres:5432/fda_db
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
    depends_on:
      fda-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [fda_network]

  docproc:
    # Document parsing sidecar (services/docproc). Same sandbox as in AWS: no outbound
    # network, fixed CPU/memory/process limits, read-only root, no Linux capabilities,
    # non-root user (from the image). Each parse also runs in a child process killed at
    # DOCPROC_PARSE_TIMEOUT_S. Core build; FULL=1 adds Docling + OCR (several GB).
    build:
      context: ./services/docproc
      args:
        FULL: ${DOCPROC_FULL:-0}
    image: medexregai/docproc:local
    environment:
      DOCPROC_API_KEY: ${DOCPROC_API_KEY:?run scripts/setup-env.sh to create .env}
      DOCPROC_CONCURRENCY: "1"
      DOCPROC_PARSE_TIMEOUT_S: "120"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    restart: unless-stopped
    networks: [docproc_sandbox]

  docproc-gateway:
    # The only way in: forwards 127.0.0.1:4200 on the host to docproc. docproc itself has
    # no published port and no route out; this proxy only relays connections it receives.
    image: nginx:1.27.3-alpine
    command: ["nginx", "-c", "/etc/nginx/docproc-gateway.conf", "-g", "daemon off;"]
    volumes:
      - ./infra/docker/docproc-gateway.conf:/etc/nginx/docproc-gateway.conf:ro
    ports:
      - "127.0.0.1:${DOCPROC_HOST_PORT:-4200}:4200"
    depends_on:
      docproc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    networks: [docproc_sandbox, app_network]

  # ProjexLight MCP Server - Code Review Agent & Schema Sync (opt-in profile).
  # Image pulled from Docker Hub: https://hub.docker.com/r/projexlight/projex-dev-mcp
  mcp-server:
    profiles: ["mcp"]
    image: projexlight/projex-dev-mcp:latest
    pull_policy: always
    container_name: medexregai_mcp_server
    user: root  # Required for git hooks installation on Windows
    ports:
      - "${MCP_SERVER_PORT:-8766}:8766"
    volumes:
      - ./:/workspace
      - ./.projexlight/feedback:/feedback
      - ./mcp-server/mcp-config.json:/app/mcp-config.json:ro
    env_file:
      - ./mcp-server/.env
    environment:
      - WORKSPACE_PATH=/workspace
      - FEEDBACK_PATH=/feedback
      - MCP_SERVER_PORT=8766
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_CONFIG_FILE=/app/mcp-config.json
      - SCHEMA_SYNC_ENABLED=${SCHEMA_SYNC_ENABLED:-true}
      - SCHEMA_SYNC_INTERVAL=${SCHEMA_SYNC_INTERVAL:-30}
      - AUTO_APPLY_MIGRATIONS=${AUTO_APPLY_MIGRATIONS:-false}
      - DEVELOPER_ID=${DEVELOPER_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [app_network]

volumes:
  postgres_data:
  redis_data:
  s3_data:
  ollama_data:
  fda_postgres_data:

networks:
  app_network:
    driver: bridge
  fda_network:
    driver: bridge
  docproc_sandbox:
    # internal: no gateway to the host or the internet. Only docproc-gateway joins it too.
    driver: bridge
    internal: true
